## IDF Component Manager Manifest File
dependencies:
  idf: '>=5.5'
  # esp_hosted 1.4.0 is taken from components/espressif__esp_hosted (patched copy, see its PATCHES.md); it needs
  # esp_wifi_remote for its Wi-Fi channel registration even though this example does not use Wi-Fi.
  espressif/esp_hosted: 1.4.0
  espressif/esp_wifi_remote: 0.8.5
  # Display and touch: the Tab5 BSP in components/m5stack_tab5 with the versions of the firmware it comes from
  # (esp_codec_dev 1.6 dropped macros the BSP uses - keep 1.3.4).
  lvgl/lvgl: "9.2.2"
  espressif/esp_lcd_ili9881c: "1.0.1"
  espressif/esp_lcd_st7703: "1.0.3"
  espressif/esp_lcd_touch_gt911: "1.1.3"
  espressif/esp_lcd_touch_st7123: "1.0.0"
  espressif/esp_codec_dev: "1.3.4"
  espressif/usb_host_hid: "1.0.3"
